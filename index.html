/* =====================================================
   TIME
===================================================== */

function toMinutes(time) {

    const [hours, minutes] =
        time.split(":").map(Number);

    return hours * 60 + minutes;
}


function getNowMinutes() {

    const now = new Date();

    return (
        now.getHours() * 60 +
        now.getMinutes() +
        now.getSeconds() / 60
    );

}


/* =====================================================
   CURRENT SHOW
===================================================== */

function getCurrentShow() {

    const now = new Date();

    const day = now.getDay();

    const minutes =
        getNowMinutes();


    return shows.find(show => {

        if(show.day !== day)
            return false;


        const start =
            toMinutes(show.start);


        let end =
            toMinutes(show.end);


        if(show.end === "00:00")
            end = 1440;


        return (
            minutes >= start &&
            minutes < end
        );

    });

}


/* =====================================================
   NEXT SHOW
===================================================== */

function getNextShow() {

    const now = new Date();

    const today =
        now.getDay();

    const minutes =
        getNowMinutes();


    let candidates = [];


    for(let offset = 0; offset < 8; offset++) {

        const day =
            (today + offset) % 7;


        shows
            .filter(show => show.day === day)
            .forEach(show => {

                const start =
                    toMinutes(show.start);


                if(
                    offset === 0 &&
                    start <= minutes
                ) {
                    return;
                }


                candidates.push({
                    ...show,
                    offset
                });

            });

    }


    return candidates[0] || null;

}


/* =====================================================
   ON AIR
===================================================== */

function updateOnAir() {

    const active =
        getCurrentShow();


    const badge =
        document.getElementById("onAirBadge");

    const title =
        document.getElementById("onAirTitle");

    const presenter =
        document.getElementById("onAirPresenter");

    const show =
        document.getElementById("onAirShow");

    const time =
        document.getElementById("onAirTime");

    const icon =
        document.getElementById("onAirIcon");

    const progress =
        document.getElementById("progressBar");


    document
        .querySelectorAll(".show")
        .forEach(el => {
            el.classList.remove("current");
        });


    if(active) {

        badge.className =
            "live-pill";

        badge.innerHTML =
            `<span class="live-light"></span> LIVE`;


        title.textContent =
            "ON AIR";


        presenter.textContent =
            active.presenter;


        show.textContent =
            active.show;


        time.textContent =
            active.start +
            " — " +
            active.end;


        icon.textContent =
            "🎙️";


        const element =
            document.querySelector(
                `.show[data-day="${active.day}"][data-start="${active.start}"]`
            );


        if(element)
            element.classList.add("current");


        const now =
            getNowMinutes();

        const start =
            toMinutes(active.start);

        let end =
            toMinutes(active.end);


        if(active.end === "00:00")
            end = 1440;


        const percentage =
            Math.max(
                0,
                Math.min(
                    100,
                    ((now - start) /
                    (end - start)) * 100
                )
            );


        progress.style.width =
            percentage + "%";


        return;

    }


    /* AUTODJ */

    const next =
        getNextShow();


    badge.className =
        "auto-pill";

    badge.textContent =
        "AUTOMATIC";


    title.textContent =
        "AUTODJ";


    presenter.textContent =
        "TruckersFM";


    icon.textContent =
        "📻";


    time.textContent =
        "AUTODJ";


    progress.style.width =
        "0%";


    if(next) {

        show.textContent =
            "Next: " +
            next.presenter +
            " — " +
            next.show;

    }
    else {

        show.textContent =
            "Next scheduled show loading...";

    }

}

    ];


    container.innerHTML = "";


    const orderedDays =
        [1,2,3,4,5,6,0];


    orderedDays.forEach(day => {

        const dayShows =
            shows.filter(
                show => show.day === day
            );


        if(!dayShows.length)
            return;


        const section =
            document.createElement("div");


        section.className =
            "day";


        let html = `

            <div class="day-title">

                <h3>
                    ${dayNames[day]}
                </h3>

                <div class="line"></div>

            </div>

        `;


        dayShows.forEach(show => {

            html += `

                <div
                    class="show"
                    data-day="${show.day}"
                    data-start="${show.start}"
                >

                    <div class="time">
                        ${show.start} - ${show.end}
                    </div>

                    <div class="mic">
                        🎙️
                    </div>

                    <div class="show-info">

                        <div class="presenter">
                            ${show.presenter}
                        </div>

                        <div class="show-type">
                            ${show.show}
                        </div>

                    </div>

                    <div class="now">
                        NOW ON AIR
                    </div>

                </div>

            `;

        });


        section.innerHTML =
            html;


        container.appendChild(
            section
        );

    });

}


/* =====================================================
   COMING UP
===================================================== */

function updateComingUp() {

    const container =
        document.getElementById("comingUp");


    const today =
        new Date().getDay();

    const minutes =
        getNowMinutes();


    let upcoming = [];


    for(let offset = 0; offset < 8; offset++) {

        const day =
            (today + offset) % 7;


        shows
            .filter(show => show.day === day)
            .forEach(show => {

                const start =
                    toMinutes(show.start);


                if(
                    offset === 0 &&
                    start <= minutes
                ) {
                    return;
                }


                upcoming.push({
                    ...show,
                    offset
                });

            });

    }


    upcoming =
        upcoming.slice(0,4);


    container.innerHTML = "";


    upcoming.forEach(
        (show,index) => {

            const card =
                document.createElement("div");


            card.className =
                "upcoming-card" +
                (
                    index === 0
                    ? " next"
                    : ""
                );


            let dayText =
                show.dayName;


            if(show.offset === 1)
                dayText = "Tomorrow";


            card.innerHTML = `

                ${
                    index === 0
                    ? `<div class="badge">NEXT</div>`
                    : ""
                }

                <div class="up-day">
                    ${dayText}
                </div>

                <div class="up-time">
                    ${show.start} - ${show.end}
                </div>

                <div class="up-name">
                    ${show.presenter}
                </div>

                <div class="up-show">
                    ${show.show}
                </div>

            `;


            container.appendChild(card);

        }
    );

}


/* =====================================================
   CASTER.FM
===================================================== */

const CASTER_HOST =
    "https://morcast.caster.fm:19019";

const CASTER_MOUNT =
    "/cc4KU";

let lastSong = "";


async function getCasterMetadata() {

    const url =
        CASTER_HOST +
        "/admin/publicstats.json?_=" +
        Date.now();


    try {

        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        if(!response.ok)
            return null;


        const data =
            await response.json();


        let source = null;


        if(
            data &&
            data[1] &&
            data[1].source
        ) {

            source =
                data[1].source[
                    CASTER_MOUNT
                ];

        }


        if(!source)
            source =
                findStreamObject(data);


        if(!source)
            return null;


        const metadata =
            source.metadata || {};


        const title =
            metadata.x_icy_title ||
            metadata.title ||
            "";


        return {
            title
        };

    }

    catch(error) {

        console.log(
            "Metadata error:",
            error
        );

        return null;

    }

}


function findStreamObject(obj) {

    if(
        !obj ||
        typeof obj !== "object"
    )
        return null;


    if(
        obj.metadata &&
        (
            obj.metadata.x_icy_title ||
            obj.metadata.title
        )
    )
        return obj;


    for(
        const key in obj
    ) {

        const result =
            findStreamObject(
                obj[key]
            );


        if(result)
            return result;

    }


    return null;

}


/* =====================================================
   PARSE SONG
===================================================== */

function parseSong(text) {

    if(!text)
        return null;


    text =
        text.trim();


    const parts =
        text.split(" - ");


    if(parts.length >= 2) {

        const artist =
            parts.shift().trim();


        const title =
            parts.join(" - ").trim();


        return {
            artist,
            title
        };

    }


    return {
        artist: "TruckersFM",
        title: text
    };

}


/* =====================================================
   iTUNES ARTWORK
===================================================== */

async function findArtwork(
    artist,
    title
) {

    const cover =
        document.getElementById("cover");

    const status =
        document.getElementById("artStatus");


    status.textContent =
        "Searching iTunes artwork...";


    cover.classList.add("loading");


    return new Promise(resolve => {

        const callbackName =
            "itunes_" +
            Date.now() +
            "_" +
            Math.floor(
                Math.random() * 100000
            );


        const script =
            document.createElement("script");


        const timeout =
            setTimeout(() => {

                cleanup();

                resolve(null);

            },8000);


        window[callbackName] =
            function(data) {

                clearTimeout(timeout);


                let artwork = null;


                if(
                    data &&
                    data.resultCount > 0
                ) {

                    const result =
                        chooseBestResult(
                            data.results,
                            artist,
                            title
                        );


                    if(result) {

                        artwork =
                            result.artworkUrl100
                            ?.replace(
                                "100x100",
                                "600x600"
                            );

                    }

                }


                cleanup();

                resolve(artwork);

            };


        script.src =
            "https://itunes.apple.com/search" +
            "?term=" +
            encodeURIComponent(
                artist + " " + title
            ) +
            "&country=HU" +
            "&media=music" +
            "&entity=song" +
            "&limit=10" +
            "&callback=" +
            callbackName;


        script.onerror =
            function() {

                clearTimeout(timeout);

                cleanup();

                resolve(null);

            };


        document.body.appendChild(
            script
        );


        function cleanup() {

            delete window[
                callbackName
            ];


            if(script.parentNode) {

                script.parentNode.removeChild(
                    script
                );

            }

        }

    });

}


/* =====================================================
   BEST iTUNES RESULT
===================================================== */

function chooseBestResult(
    results,
    artist,
    title
) {

    if(!results.length)
        return null;


    const wantedArtist =
        artist.toLowerCase();


    const wantedTitle =
        title.toLowerCase();


    const exact =
        results.find(result => {

            const a =
                String(
                    result.artistName || ""
                ).toLowerCase();


            const t =
                String(
                    result.trackName || ""
                ).toLowerCase();


            return (
                a === wantedArtist &&
                t === wantedTitle
            );

        });


    if(exact)
        return exact;


    const partial =
        results.find(result => {

            const a =
                String(
                    result.artistName || ""
                ).toLowerCase();


            const t =
                String(
                    result.trackName || ""
                ).toLowerCase();


            return (
                (
                    a.includes(wantedArtist) ||
                    wantedArtist.includes(a)
                ) &&
                (
                    t.includes(wantedTitle) ||
                    wantedTitle.includes(t)
                )
            );

        });


    return partial || results[0];

}


/* =====================================================
   NOW PLAYING
===================================================== */

async function updateNowPlaying() {

    const data =
        await getCasterMetadata();


    if(!data || !data.title)
        return;


    const parsed =
        parseSong(data.title);


    if(!parsed)
        return;


    const songID =
        parsed.artist +
        " - " +
        parsed.title;


    if(songID === lastSong)
        return;


    lastSong =
        songID;


    document.getElementById(
        "artist"
    ).textContent =
        parsed.artist;


    document.getElementById(
        "song"
    ).textContent =
        parsed.title;


    const artwork =
        await findArtwork(
            parsed.artist,
            parsed.title
        );


    const cover =
        document.getElementById("cover");

    const status =
        document.getElementById("artStatus");


    if(artwork) {

        cover.src =
            artwork;


        cover.classList.remove(
            "loading"
        );


        status.textContent =
            "iTunes album artwork ✓";

    }

    else {

        cover.src =
            fallbackCover;


        cover.classList.remove(
            "loading"
        );


        status.textContent =
            "No iTunes artwork found";

    }

}
